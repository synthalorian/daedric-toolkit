[package]
name = "daedric-core"
version = "0.1.0"
edition = "2021"
description = "Core engine for the Daedric Toolkit: launcher manifest decode, install scanning, hash-gate verification"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md5 = "0.7"
thiserror = "2"
walkdir = "2"
