[package]
name = "daedric-toolkit"
version = "0.1.0"
edition = "2021"
description = "Daedric Online toolkit — install doctor and setup wizard"

[lib]
name = "daedric_toolkit_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "daedric-toolkit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
daedric-core = { path = "../crates/core" }
